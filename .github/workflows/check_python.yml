name: Run Python Cron Job

on:
  # 1. Run on a schedule (e.g., every hour at the top of the hour)
  schedule:
    - cron: '0 * * * *'
  
  # 2. Allow you to run this manually from the "Actions" tab
  workflow_dispatch:
  
  # 3. Run on every push to the main branch
  push:
    branches: [ main ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: OpsDashboard Secrets

    # These secrets will be available as environment variables for all steps
    env:
      
      # New AWS Secrets
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_CLUSTER_ARN: ${{ secrets.AWS_CLUSTER_ARN }}
      AWS_DB_NAME: ${{ secrets.AWS_DB_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SECRET_ARN: ${{ secrets.AWS_SECRET_ARN }}

      # New LangChain Secrets
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_ENDPOINT: ${{ secrets.LANGCHAIN_ENDPOINT }}
      LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
      LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }} 

      # New OpenAI Secrets
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # New Supabase Secrets
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # AgentMail Secrets
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_FROM_ADDRESS: ${{ secrets.AGENTMAIL_FROM_ADDRESS }} 
      AGENTMAIL_TO_ADDRESS: ${{ secrets.AGENTMAIL_TO_ADDRESS }}

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # You can change this to your desired version

      - name: 3. Install dependencies
        run: pip install -r requirements.txt

      - name: 4. Verify required env vars
        shell: bash
        run: |
          for var in SUPABASE_URL SUPABASE_KEY AWS_REGION AWS_CLUSTER_ARN AWS_SECRET_ARN AWS_DB_NAME OPENAI_API_KEY; do
            test -n "${!var}" || { echo "::error::$var is empty"; exit 1; }
          done


      - name: 5. Run Python script
        # This script now has access to all env vars from the 'env:' block
        run: python cron_app.py
