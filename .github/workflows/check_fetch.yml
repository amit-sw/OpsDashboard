name: Check Streamlit App Fetch

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:      # manual trigger

jobs:
  check-uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Streamlit app status
        run: |
          node --input-type=module -e "
            const url = 'https://aiclubops.streamlit.app/?cronId=Sessions&duration=2';
            (async () => {
              try {
                const res = await fetch(url);
                if (res.ok) {
                  console.log('✅ ' + url + ' is up! (HTTP ' + res.status + ')');
                } else {
                  console.error('❌ ' + url + ' returned HTTP ' + res.status);
                  process.exit(1);
                }
              } catch (err) {
                console.error('⚠️ Failed to reach ' + url + ':', err.message);
                process.exit(1);
              }
            })();
          "

